name: technologyagent

services:
  mongodb:
    image: mongo:8.0
    container_name: technologyagent-mongodb
    command: ["mongod", "--replSet", "ta-rs", "--bind_ip_all", "--port", "27027"]
    ports:
      - "127.0.0.1:27027:27027"
    volumes:
      - ./mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - |
          mongosh --port 27027 --quiet --eval '
          const expectedSet = "ta-rs";
          function assertPrimary() {
            const status = rs.status();
            const hello = db.adminCommand({hello: 1});
            if (status.ok !== 1 || status.set !== expectedSet || status.myState !== 1 ||
                hello.setName !== expectedSet || hello.isWritablePrimary !== true) quit(1);
          }
          try { assertPrimary(); }
          catch (e) {
            if (e.code !== 94 && e.codeName !== "NotYetInitialized") throw e;
            const initialized = rs.initiate({_id: expectedSet, members: [{_id: 0, host: "localhost:27027"}]});
            if (!initialized || initialized.ok !== 1) quit(1);
            assertPrimary();
          }'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s
    restart: unless-stopped
