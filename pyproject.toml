[project]
name = "technologyagent"
version = "0.1.0"
description = "TechnologyAgent procurement agent foundation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "deepagents==0.7.30",
    "fastapi==0.161.1",
    "fastmcp==4.1.3",
    "httpx==0.28.1",
    "langchain-core==1.7.0",
    "langchain-openai==1.7.2",
    "langgraph==1.2.16",
    "langgraph-checkpoint-mongodb==0.5.1",
    "pydantic==2.14.1",
    "pymongo==4.19.0",
    "python-dotenv==1.2.4",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]
